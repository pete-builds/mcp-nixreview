name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# uv is pinned here (and in the Dockerfile) on purpose: a floating resolver turns a
# routine dependency PR into a silent resolver migration. Dependabot will not bump
# it, so moving uv is a deliberate change in both places.
env:
  UV_VERSION: "0.12.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install from the lock
        # --locked installs exactly what uv.lock says and REFUSES when uv.lock no
        # longer matches pyproject.toml. That refusal matters: `test` is the only
        # required check, and --frozen would install a stale lock silently and stay
        # green while the image shipped the old pin.
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Import smoke
        run: uv run --frozen python -c "from mcp_nixreview.server import build_server, main; print('import ok')"
      - name: Tests
        run: uv run --frozen pytest -q

  lock:
    name: uv.lock matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Check the lock
        # Fails when pyproject.toml changed without relocking. Unlike the old
        # full-recompile drift check it does not re-resolve against today's PyPI,
        # so an upstream release can no longer turn this red with no commit behind it.
        run: uv lock --check

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: "true"

  image:
    name: docker build + interpreter guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-nixreview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executed the
        # *image's* interpreter. That let a Dependabot base-image bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 on sister repos and ship a
        # runtime no lockfile or check had exercised, with CI fully green.
        #
        # pyproject requires >=3.13, ruff targets py313 and the test job runs on
        # 3.13 from uv.lock, so the image must agree.
        # --entrypoint is required: the image's ENTRYPOINT is the server itself.
        run: |
          docker run --rm --entrypoint python mcp-nixreview:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but pyproject, ruff "
              f"and the tests all target {want[0]}.{want[1]}. Fix the "
              f"Dockerfile FROM tag, or retarget every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '

      - name: The image's installed dependencies import the server
        # The image's dependency set comes from `uv export` in the builder, a path
        # the test job never runs. Importing the server inside the image, as the
        # runtime user, proves that export installed everything the server needs.
        run: |
          docker run --rm --entrypoint python mcp-nixreview:ci -c \
            'from mcp_nixreview.server import build_server, main; print("image import ok")'
