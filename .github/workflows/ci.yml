name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Import smoke
        run: python -c "from mcp_nixreview.server import build_server, main; print('import ok')"
      - name: Tests
        run: pytest -q

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: "true"

  image:
    name: docker build + interpreter guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-nixreview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executed the
        # *image's* interpreter. That let a Dependabot base-image bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 on sister repos and ship a
        # runtime no lockfile or check had exercised, with CI fully green.
        #
        # pyproject requires >=3.13, ruff targets py313 and requirements.lock is
        # compiled with --python-version 3.13, so the image must agree.
        # --entrypoint is required: the image's ENTRYPOINT is the server itself.
        run: |
          docker run --rm --entrypoint python mcp-nixreview:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but pyproject, ruff "
              f"and requirements.lock all target {want[0]}.{want[1]}. Fix the "
              f"Dockerfile FROM tag, or retarget every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '
