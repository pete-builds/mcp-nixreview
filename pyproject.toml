[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-nixreview"
version = "0.1.1"
description = "Advisory NixOS change-review + CVE/KEV attestation gate (MCP server)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "pete-builds" }]
keywords = ["mcp", "nixos", "security", "cve", "kev", "fastmcp"]

dependencies = [
    "fastmcp==4.0.10",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[project.scripts]
mcp-nixreview = "mcp_nixreview.server:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-nixreview"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_nixreview = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# MCP SDK v2 renamed protocol fields to snake_case and FastMCP 4 keeps the old
# camelCase reads alive through a deprecation bridge slated for removal. Fail
# on the warning now, so the bridge's removal can never be the first notice.
filterwarnings = ["error::fastmcp.FastMCPDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
